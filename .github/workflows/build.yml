name: Build Standoff Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Build with ndk-build
        run: |
          # Проверяем, есть ли папка jni (или ximira source/jni)
          if [ -d "jni" ]; then
            cd jni
          elif [ -d "ximira source/jni" ]; then
            cd "ximira source/jni"
          else
            echo "Папка jni не найдена!"
            ls -la
            exit 1
          fi
          
          echo "Сборка в папке: $(pwd)"
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Library
        uses: actions/upload-artifact@v4
        with:
          name: Built-Library
          path: '**/libs/arm64-v8a/*.so'
