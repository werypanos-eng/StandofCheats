- name: Build with ndk-build
  run: |
    JNI_DIR=$(find . -type d -name "jni" | grep -v "backups" | head -n 1)
    
    if [ -z "$JNI_DIR" ]; then
      echo "Ошибка: Папка jni не найдена!"
      exit 1
    fi
    
    cd "$JNI_DIR"
    echo "Сборка в папке: $(pwd)"
    
    # Принудительно добавляем библиотеку C++ через флаги
    $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a APP_LDFLAGS="-lc++_shared"
  env:
    ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
